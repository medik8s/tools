    description: This self node remediation operator is using an alternate mechanism
      for a node in a cluster to detect its health status and take actions to remediate
      itself in case of a failure. While not all remediation events can result in
      the node returning to a healthy state, the operator does allow surviving parts
      of the cluster to assume the node has reached a safe state so that it’s workloads
      can be automatically recovered. A prerequisite for the Self Node Remediation
      operator is a functioning health detection system that implements the external
      remediation API, such as Node Health Check Operator or Machine Health Check
      Controller (in OCP or Cluster-API based clusters). Once a node/machine is unhealthy,
      the detection system will create the SelfNodeRemediation CR, which triggers
      the Self Node Remediation Operator. For this the configuration of the health
      detection system needs to refer to a SelfNodeRemediationTemplate CR. Such a
      template is created by default in the operator's namespace, for usage in other
      namespaces it needs to be created manually. The Node Health Check Operator is
      configured to use Self Node Remediation by default.
    displayName: Self Node Remediation Operator
    installModes:
    - supported: false
      type: OwnNamespace
    - supported: false
      type: SingleNamespace
    - supported: false
      type: MultiNamespace
    - supported: true
      type: AllNamespaces
    keywords:
    - fencing
    - remediation
    - auto-healing
    - recovery
    - high-availability
    - baremetal
    - SNR
    links:
    - name: Self Node Remediation
      url: https://access.redhat.com/documentation/en-us/workload_availability_for_red_hat_openshift/23.2/html/remediation_fencing_and_maintenance.html
    - name: Source Code
